</style></head><body><main class="main"><header><h1>🎃 中环万圣节 · 地图</h1><p>2026.10.31 · 6 个核心地点 · 点击图钉看照片</p></header><div id="map"></div><p class="help">📍 黄色 1 是交易广场集合点。紫色 2–6 是推荐打卡点。点图钉或下方照片即可定位。</p><div id="spots" class="spots"></div><details class="sub"><summary>🚇 地铁出口 & ☕ 备选咖啡厅</summary><p>次级位置不占用主地图，点名称直接打开 Google 地图。咖啡厅当晚营业时段请提前查。</p><div id="extras"></div></details><p class="notice">⚠️ 地图图钉为街区参考位置，并非精确入口。万圣节当晚会有人流管制，和安里/荣华里并非稳定捷径。图片均为既有实景参考，非 2026 万圣节现场实时照片。</p><footer>© OpenStreetMap contributors · 图片来源见各地点弹窗 · <a href="./README.md">完整行程</a></footer></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const locations=[{"id":"exchange","n":"交易广场","en":"Exchange Square","lat":22.28415,"lng":114.15735,"tag":"集合点","detail":"康乐广场 8 号；先在这里集合，再往皇后像广场。","img":"https://www.news.gov.hk/eng/2024/12/20241218/20241218_173435_362/images/20241218185559136.jpg","source":"香港政府新闻网（建筑实景）","src":"https://www.news.gov.hk/eng/2024/12/20241218/20241218_173435_362.html","q":"Exchange Square, 8 Connaught Place, Central, Hong Kong"},{"id":"statue","n":"皇后像广场","en":"Statue Square South","lat":22.28165,"lng":114.15855,"tag":"官方布景","detail":"主题装置区；图为广场日常景色，并非今年万圣节布景实拍。","img":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Statue_Square_%28Hong_Kong%29.jpg/960px-Statue_Square_%28Hong_Kong%29.jpg","source":"Wikimedia Commons · Mk2010（历史环境照）","src":"https://commons.wikimedia.org/wiki/File:Statue_Square_(Hong_Kong).jpg","q":"Statue Square Gardens South, Central, Hong Kong"},{"id":"stone","n":"砵典乍街","en":"Pottinger Street","lat":22.2822,"lng":114.1557,"tag":"石板街拍照","detail":"复古石阶和街头道具；推荐傍晚打卡。","img":"https://upload.wikimedia.org/wikipedia/commons/c/cc/Pottinger_Street_stone_steps_at_the_bottom.Near.JPG","source":"Wikimedia Commons · 石阶实景","src":"https://commons.wikimedia.org/wiki/File:Pottinger_Street_stone_steps_at_the_bottom.Near.JPG","q":"Pottinger Street, Central, Hong Kong"},{"id":"lkf","n":"兰桂坊","en":"Lan Kwai Fong","lat":22.28068,"lng":114.15554,"tag":"万圣节主场","detail":"人群与 Cosplay 核心区域；图为 2018 年万圣节夜景，非今年现场。","img":"https://arthistory.hku.hk/HKinTransition/files/photo/v5/1440w/201810/300719-201810447.jpg","source":"香港大学 Hong Kong in Transition（2018）","src":"https://arthistory.hku.hk/HKinTransition/image_detail.php?id=61765","q":"Lan Kwai Fong, Central, Hong Kong"},{"id":"soho","n":"SoHo 小街","en":"Staunton / Peel Street","lat":22.28174,"lng":114.15316,"tag":"外围街拍","detail":"士丹顿街与卑利街周边，作为较灵活的转场；仍可能拥挤。","img":"https://commons.wikimedia.org/wiki/Special:FilePath/HK%20%E4%B8%AD%E7%92%B0%20Central%20%E5%A3%AB%E4%B8%B9%E9%A0%93%E8%A1%97%20Staunton%20Street%20SOHO%20Shelley%20Street%20visitors%20Sunday%20September%202024%20R12S%2001.jpg?width=900","source":"Wikimedia Commons · 2024 街景","src":"https://commons.wikimedia.org/wiki/File:HK_中環_Central_士丹頓街_Staunton_Street_SOHO_Shelley_Street_visitors_Sunday_September_2024_R12S_01.jpg","q":"Staunton Street and Peel Street, Soho, Central, Hong Kong"},{"id":"taikwun","n":"大馆","en":"Tai Kwun","lat":22.28106,"lng":114.15417,"tag":"复古建筑","detail":"庭院和旧警署建筑，傍晚拍照或喝咖啡。","img":"https://i0.wp.com/purcellarchitecture.com/wp-content/uploads/2025/06/Tai-Kwun-05-1-scaled.jpg?fit=600%2C581&ssl=1","source":"Purcell Architecture（建筑实景）","src":"https://purcellarchitecture.com/project/tai-kwun/","q":"Tai Kwun, 10 Hollywood Road, Central, Hong Kong"}],extras=[["🚇 中环站 K 出口","Central MTR Exit K, Hong Kong"],["🚇 中环站 D2 出口","Central MTR Exit D2, Hong Kong"],["🚇 香港站","Hong Kong MTR Station, Hong Kong"],["☕ Café Claudel","Cafe Claudel Tai Kwun Hong Kong"],["☕ Café Landmark","Cafe Landmark LANDMARK ATRIUM Hong Kong"],["☕ Coffeelin","Coffeelin 31 Queen's Road Central Hong Kong"],["☕ Milligram Coffee","Milligram Coffee 174 Wellington Street Hong Kong"],["☕ Haus Coffee Club","Haus Coffee Club 32 Staunton Street Hong Kong"]];
const map=L.map('map',{zoomControl:true,scrollWheelZoom:false}).setView([22.282,114.156],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);

locations.forEach((p,i)=>{const marker=L.marker([p.lat,p.lng],{icon:L.divIcon({html:'<div class="pin '+(i===0?'first':'')+'">'+(i+1)+'</div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(map);const popup='<img src="'+esc(p.img)+'" alt="'+esc(p.n)+' 参考照片" loading="lazy" onerror="this.style.display=\'none\'"><strong>'+(i+1)+'. '+esc(p.n)+'</strong><p>'+esc(p.detail)+'</p><small>照片：<a href="'+esc(p.src)+'" target="_blank" rel="noopener">'+esc(p.source)+'</a></small><a href="'+go(p.q)+'" target="_blank" rel="noopener">🚶 步行导航 ↗</a>';marker.bindPopup(popup,{maxWidth:270});markers.push(marker);const b=document.createElement('button');b.className='spot';b.innerHTML='<img alt="" loading="lazy" src="'+esc(p.img)+'"><span><strong>'+(i+1)+'. '+esc(p.n)+'</strong><small>'+esc(p.tag)+'</small></span>';b.onclick=()=>{map.setView([p.lat,p.lng],16,{animate:true});marker.openPopup();};document.getElementById('spots').appendChild(b)});
map.fitBounds(locations.map(p=>[p.lat,p.lng]),{padding:[25,25],maxZoom:16});

</script></body></html>
